[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ClayFF-Toolkit"
version = "0.1.0"
description = "Unified toolkit for clay substitution, ClayFF assignment, validation, and LAMMPS export."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "numpy>=1.24",
  "ase>=3.22",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.8.3",
  "ovito>=3.15",
]

[project.scripts]
clayff-toolkit = "clayff_toolkit.cli:main"

[project.gui-scripts]
clayff-toolkit-gui = "clayff_toolkit.gui_launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
clayff_toolkit = ["resources/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
