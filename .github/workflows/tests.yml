name: tests

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run Linux core tests
        run: |
          python -m pytest \
            tests/test_install_script.py \
            tests/test_windows_install_script.py \
            tests/test_cli_doctor.py \
            tests/test_material_studio_xsd.py \
            tests/test_material_studio_off.py
      - name: Check CLI diagnostics
        run: python -m clayff_toolkit doctor

  windows-core:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run Windows core tests
        run: |
          python -m pytest `
            tests/test_windows_install_script.py `
            tests/test_cli_doctor.py
      - name: Smoke-test PowerShell installer
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "clayff-bin"
          $venvDir = Join-Path $env:RUNNER_TEMP "clayff-venv"
          powershell -ExecutionPolicy Bypass -File scripts\install-clayff-toolkit.ps1 -NoGui -NoPathUpdate -BinDir $binDir -Venv $venvDir
          & (Join-Path $binDir "clayff-toolkit.cmd") --help
          & (Join-Path $binDir "clayff-toolkit.cmd") doctor

  windows-gui-artifact:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build licensed Windows GUI distribution
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows-gui.ps1 -Python python
      - name: Verify executable artifact
        run: |
          $exePath = Join-Path $PWD "dist\ClayFF-Toolkit.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected Windows executable was not created: $exePath"
          }
          & $exePath --smoke-test
          $archivePath = Join-Path $PWD "dist\ClayFF-Toolkit-Windows-x64.zip"
          if (-not (Test-Path $archivePath)) {
            throw "Expected licensed Windows archive was not created: $archivePath"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ClayFF-Toolkit-Windows-x64
          path: dist/ClayFF-Toolkit-Windows-x64.zip
          retention-days: 3
