name: release-windows

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-gui-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build licensed Windows GUI distribution
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows-gui.ps1 -Python python
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ClayFF-Toolkit-Windows-x64
          path: dist/ClayFF-Toolkit-Windows-x64.zip
          retention-days: 7
      - name: Attach licensed distribution to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "dist\ClayFF-Toolkit-Windows-x64.zip" `
            --clobber
